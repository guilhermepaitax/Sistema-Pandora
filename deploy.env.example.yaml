# Exemplo de variáveis para Cloud Run (YAML simples aceito por --env-vars-file)
# Copie para deploy.env.yaml, preencha SENHAS e rode o script scripts/deploy_fast.ps1
DJANGO_SECRET_KEY: "GERAR_CHAVE_UNICA_64+" # Use algo forte (ex: openssl rand -hex 48)
DJANGO_DEBUG: "False"
PANDORA_VERSION: "0.1.0"
# Banco Postgres via socket Cloud SQL (encode especiais na senha). Ex: @ -> %40  * -> %2A
DATABASE_URL: "postgres://pandora_user:SENHA_URL@/pandora_app?host=/cloudsql/pandora-474013:southamerica-east1:pandora-db"
ENABLE_WHITENOISE: "1"
MIGRATION_MAX_RETRIES: "10"
MIGRATION_INITIAL_SLEEP_SECONDS: "3"
MIGRATION_BACKOFF_FACTOR: "1.6"
WAIT_FOR_CLOUDSQL: "1"
# Opcional: usar Gunicorn (1) ou Daphne (0 default)
USE_GUNICORN: "0"
GUNICORN_WORKERS: "3"
GUNICORN_TIMEOUT: "90"
# Superuser bootstrap (opcional). Se omitir cria automático com senha aleatória.
#DJANGO_SUPERUSER_USERNAME: "admin"
#DJANGO_SUPERUSER_EMAIL: "admin@example.com"
#DJANGO_SUPERUSER_PASSWORD: "SENHA_SUPER"
# Hosts / CSRF (ajuste depois de apontar domínio customizado)
PANDORA_ALLOWED_HOSTS: "pandora-app-<HASH>.southamerica-east1.run.app"
PANDORA_CSRF_ORIGINS: "https://pandora-app-<HASH>.southamerica-east1.run.app"
