runtime: python311
entrypoint: ./entrypoint.sh

instance_class: F1
automatic_scaling:
  max_instances: 1

# Garanta que o nome do seu arquivo de segredos é 'env.yaml'
includes:
  - env.yaml

handlers:
  # Aponta para a pasta correta que o 'collectstatic' usa
  - url: /static
    static_dir: staticfiles

  # Mantido por enquanto, mas lembre-se que uploads de usuário precisarão de ajuste futuro
  - url: /media
    static_dir: media

beta_settings:
  cloud_sql_instances: pandora-474013:southamerica-east1:pandora-db
