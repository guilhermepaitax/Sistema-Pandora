# fly.toml app configuration file generated for pandora-app on 2025-10-14T11:49:16-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sistema-pandora'
primary_region = 'gru'
# Nosso container usa WORKDIR /app; o console usa python manage.py do diretório atual
console_command = 'python manage.py shell'

[build]



[env]
  # Porta usada pelo entrypoint/Gunicorn
  PORT = '8080'
  USE_GUNICORN = '1'
  GUNICORN_WORKERS = '1'
  MIGRATION_MAX_RETRIES = '1'
  # Migrações rodam no release_command; evita duplicar no entrypoint
  SKIP_STARTUP_MIGRATIONS = '1'

#[processes]
# Não definimos processos customizados para não pular o entrypoint.sh
# O CMD do container (entrypoint.sh) gerencia migrações e inicia o servidor

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'        # não parar automaticamente durante migrações
  auto_start_machines = true
  min_machines_running = 1          # manter 1 máquina ativa
  # processes = ['app']

[[vm]]
  # Reduz para 256MB para economizar custo; ajuste se faltar memória
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  # Arquivos estáticos coletados em build para este caminho
  guest_path = '/app/staticfiles_collected'
  url_prefix = '/static/'


[experimental]
  private_network = true



